<div id="project-setup">
    <h1> Welcome to Magic Node</h1>

    <div class="project-field">
      <label>Project name</label> 
      <input 
        id="project-name"
        type="text"
        placeholder="My Awesome Project"

      >
    </div>

    <div class="project-field">
      <label>Project parent folder</label>

      <div class="folder-row">
        <input 
          id="project-folder"
          type="text"
          placeholder="C:\Projects"
          readonly
        >

        <button id="browse-folder">
          Browse...    
        </button>
      </div>
    </div>

    <button id="create-project">
        Create project
    </button>

</div>
