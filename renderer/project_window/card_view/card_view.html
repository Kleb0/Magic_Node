<!DOCTYPE html>
<html>

  <head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="card_view.css">

  </head>

  <body>
      <article class="card">
          <header class="card-header">

            <button
              id="open-big-card-button"
              type="button">
              +
            </button>

            <h3 id="card-title"></h3>

            <button
              id="open-wiki-button"
              type="button">
              📖
            </button>
          </header>

        <button id="card-image-zone" class="card-image-zone" type="button">
          <img id="card-image" alt="">
          <span id="card-image-placeholder">choisir une card-image-zone</span>
        </button>

        <section class="card-description">
          <p id="card-description"></p>
        </section>

      </article>

    <script src="card_view.js"></script>
  </body>
</html>
