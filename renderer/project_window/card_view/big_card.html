<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="big_card.css">
</head>

<body>

  <article class="big-card">

    <header class="card-header">

      <h1 id="card-title"></h1>

      <button
        id="open-wiki-button"
        type="button">
        📖
      </button>

    </header>

    <button
      id="card-image-zone"
      class="card-image-zone"
      type="button">

      <img id="card-image" alt="">

      <span id="card-image-placeholder">
        choisir une image
      </span>

    </button>

    <section class="card-description">

      <p id="card-description"></p>

    </section>

  </article>

  <script src="big_card.js"></script>

</body>
</html>
